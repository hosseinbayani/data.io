<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل ادمین — سامانه ارزیابی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{--primary:#1e40af;--primary-light:#3b82f6;--primary-dark:#1e3a8a;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--radius:12px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:14px}
  .hidden{display:none !important}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#3b82f6);padding:20px}
  .login-card{background:#fff;border-radius:20px;padding:40px 36px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .login-card .logo{font-size:48px;text-align:center;margin-bottom:10px}
  .login-card h1{text-align:center;font-size:20px;color:var(--primary-dark);margin-bottom:24px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--border);border-radius:8px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  .app-header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:16px 0}
  .header-inner{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand h1{font-size:16px}
  .content{max-width:1320px;margin:0 auto;padding:24px}
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
  .card-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,#fafbfc,#fff)}
  .card-head h2{font-size:15.5px}
  .card-body{padding:22px}
  .btn{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:10px 18px;border-radius:10px;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-ghost{background:#fff;color:var(--text);border-color:var(--border)}
  .btn-ghost:hover{background:#f8fafc}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--border)}
  th{background:#f8fafc;font-size:12px;color:var(--muted);font-weight:700}
  tr:hover td{background:#f8fafc}
  .actions-cell{display:flex;gap:6px;justify-content:flex-end}
  .icon-btn{padding:6px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-family:inherit}
  .icon-btn:hover{background:#f1f5f9}
  .icon-btn.danger{color:var(--danger);border-color:#fecaca}
  .icon-btn.danger:hover{background:#fef2f2}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px}
  .tab{padding:10px 20px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;opacity:0;transition:opacity .3s;z-index:999}
  .toast.show{opacity:1}
  .toast.error{background:var(--danger)}
  .toast.success{background:var(--success)}
  .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#f1f5f9;color:var(--muted)}
  .badge-admin{background:rgba(139,92,246,.15);color:#8b5cf6}
  .badge-manager{background:rgba(245,158,11,.15);color:#b45309}
  .badge-senior{background:rgba(239,68,68,.15);color:#dc2626}
  .badge-evaluator{background:rgba(59,130,246,.15);color:var(--primary)}
  .badge-active{background:rgba(16,185,129,.15);color:var(--success)}
  .hint{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 16px;font-size:12.5px;color:#1e40af;line-height:1.85;margin-bottom:16px}
  .modal-back{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:26px}
  .modal h3{font-size:16px;margin-bottom:16px}
  .csv-area{width:100%;min-height:180px;font-family:monospace;font-size:12.5px;padding:12px;border:1px solid var(--border);border-radius:8px;direction:ltr;text-align:left}
  .status-filter{display:flex;gap:6px;flex-wrap:wrap}
  .status-filter button{padding:6px 14px;font-size:12px;font-weight:600;border-radius:20px;border:1px solid var(--border);background:#fff;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .15s}
  .status-filter button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.content{padding:16px}}
</style>
</head>
<body>

<div class="login-wrap hidden" id="loginScreen">
  <div class="login-card">
    <div class="logo">⚙️</div>
    <h1>ورود به پنل ادمین</h1>
    <div class="field"><label>ایمیل</label><input type="email" id="loginEmail" dir="ltr"></div>
    <div class="field"><label>رمز عبور</label><input type="password" id="loginPassword" dir="ltr" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">ورود</button>
    <div id="loginError" style="color:var(--danger);font-size:13px;margin-top:12px;text-align:center"></div>
  </div>
</div>

<div class="hidden" id="appScreen">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand"><div style="font-size:22px">⚙️</div><div><h1>پنل مدیریت سامانه ارزیابی</h1></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="index.html" class="btn btn-ghost">📝 فرم ارزیابی</a>
        <a href="manager.html" class="btn btn-ghost">👔 پنل مدیر</a>
        <button class="btn btn-ghost" onclick="logout()">🚪 خروج</button>
      </div>
    </div>
  </header>
  <main class="content">
    <div class="tabs">
      <div class="tab active" data-tab="employees" onclick="switchTab('employees')">👥 پرسنل</div>
      <div class="tab" data-tab="evaluators" onclick="switchTab('evaluators')">👤 کاربران</div>
      <div class="tab" data-tab="stats" onclick="switchTab('stats')">📊 آمار</div>
    </div>
    <div id="tabContent"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUser=null, currentProfile=null;
let employees=[], profiles=[], evaluations=[], pendingUsers=[];
let userStatusFilter = 'all';

function showToast(msg, type=''){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(()=> t.className = 'toast', 2500);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  document.getElementById('loginError').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ document.getElementById('loginError').textContent = error.message; return; }
  initApp();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session) initApp();
  else document.getElementById('loginScreen').classList.remove('hidden');
}

async function initApp(){
  const { data:{ user } } = await sb.auth.getUser();
  if (!user){ document.getElementById('loginScreen').classList.remove('hidden'); return; }
  currentUser = user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  currentProfile = profile;
  if (!profile || profile.role !== 'admin'){
    alert('شما دسترسی ادمین ندارید.');
    await sb.auth.signOut(); location.reload(); return;
  }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  await loadAll();
  switchTab('employees');
}

async function loadAll(){
  const [e, p, ev, pu] = await Promise.all([
    sb.from('employees').select('*').order('full_name'),
    sb.from('profiles').select('*').order('full_name'),
    sb.from('evaluations').select('id, employee_id, evaluator_id, status, final_score'),
    sb.from('pending_users').select('email, full_name, role, claimed, claimed_at')
  ]);
  employees = e.data || [];
  profiles = p.data || [];
  evaluations = ev.data || [];
  pendingUsers = pu.data || [];
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === t));
  if (t === 'employees') renderEmployees();
  if (t === 'evaluators') renderEvaluators();
  if (t === 'stats') renderStats();
}

// ============================================================
// Employees Tab
// ============================================================
function renderEmployees(){
  let html = `<div class="card">
    <div class="card-head"><h2>👥 مدیریت پرسنل</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="openBulkUpload()">📋 افزودن گروهی (CSV)</button>
        <button class="btn btn-primary" onclick="openAddEmployee()">➕ افزودن پرسنل</button>
      </div>
    </div>
    <div class="card-body" style="padding:0">`;
  if (!employees.length){
    html += `<div style="padding:40px;text-align:center;color:var(--muted)">هنوز پرسنلی ثبت نشده.</div>`;
  } else {
    html += `<table><thead><tr>
      <th>نام</th><th>کد</th><th>سمت</th><th>سطح</th><th>واحد</th><th>دسته</th><th>ارزیاب</th><th>وضعیت</th><th></th>
    </tr></thead><tbody>`;
    employees.forEach(e => {
      const ev = evaluations.find(x => x.employee_id === e.id);
      const evName = profiles.find(p => p.id === e.evaluator_id)?.full_name || '—';
      const catLabel = e.category === 'technical' ? 'فنی' : 'ستادی';
      const statusBadge = !ev ? '<span class="badge">شروع نشده</span>'
        : ev.status === 'submitted' ? '<span class="badge badge-active">ارسال‌شده</span>'
        : '<span class="badge" style="background:rgba(245,158,11,.15);color:#f59e0b">پیش‌نویس</span>';
      html += `<tr>
        <td><b>${escapeHtml(e.full_name)}</b></td>
        <td>${escapeHtml(e.personnel_code||'—')}</td>
        <td>${escapeHtml(e.position||'—')}</td>
        <td>${escapeHtml(e.job_level||'—')}</td>
        <td>${escapeHtml(e.unit||'—')}</td>
        <td>${catLabel}</td>
        <td>${escapeHtml(evName)}</td>
        <td>${statusBadge}</td>
        <td class="actions-cell">
          <button class="icon-btn" onclick="openEditEmployee('${e.id}')">✏️</button>
          <button class="icon-btn danger" onclick="deleteEmployee('${e.id}')">🗑</button>
        </td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</
