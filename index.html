<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه ارزیابی عملکرد</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
  :root{--primary:#1e40af;--primary-light:#3b82f6;--primary-dark:#1e3a8a;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--beh:#8b5cf6;--func:#0ea5e9;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);--radius:14px;--radius-sm:8px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:14px}
  .hidden{display:none !important}
  .btn{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:10px 18px;border-radius:10px;border:1px solid transparent;transition:all .18s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-ghost{background:#fff;color:var(--text);border-color:var(--border)}
  .btn-ghost:hover{background:#f8fafc}
  .btn-success{background:var(--success);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  .field input:disabled,.field textarea:disabled,.field select:disabled{background:#f8fafc;color:var(--muted);cursor:not-allowed}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#3b82f6);padding:20px}
  .login-card{background:#fff;border-radius:20px;padding:40px 36px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .login-card .logo{font-size:48px;text-align:center;margin-bottom:10px}
  .login-card h1{text-align:center;font-size:20px;color:var(--primary-dark);margin-bottom:6px}
  .login-card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  .login-error{background:#fef2f2;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;border:1px solid #fecaca}
  .app-header{background:linear-gradient(135deg,var(--primary-dark),var(--primary),var(--primary-light));color:#fff;padding:16px 0;box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
  .header-inner{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:22px}
  .brand h1{font-size:16px;font-weight:700}
  .brand p{font-size:11.5px;opacity:.85}
  .header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .user-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);padding:7px 14px;border-radius:20px;font-size:12.5px;color:#fff}
  .content{max-width:1320px;margin:0 auto;padding:24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .card-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,#fafbfc,#fff)}
  .card-head h2{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:10px}
  .card-body{padding:22px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .dot-beh{background:var(--beh)}
  .dot-func{background:var(--func)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;background:#f1f5f9;color:var(--muted)}
  .badge-beh{background:rgba(139,92,246,.1);color:var(--beh)}
  .badge-func{background:rgba(14,165,233,.1);color:var(--func)}
  .emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .emp-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all .2s;position:relative}
  .emp-card:hover{border-color:var(--primary-light);transform:translateY(-2px);box-shadow:var(--shadow)}
  .emp-card .emp-name{font-size:15px;font-weight:700;margin-bottom:4px}
  .emp-card .emp-pos{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .emp-card .emp-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
  .emp-card .emp-meta span{background:#f1f5f9;padding:3px 8px;border-radius:10px;color:var(--muted)}
  .status-chip{position:absolute;top:14px;left:14px;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px}
  .status-none{background:#f1f5f9;color:var(--muted)}
  .status-draft{background:rgba(245,158,11,.15);color:var(--warning)}
  .status-submitted{background:rgba(16,185,129,.15);color:var(--success)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty-state .ico{font-size:56px;margin-bottom:14px;opacity:.4}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .hint-box{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border:1px solid #bfdbfe;border-radius:var(--radius-sm);padding:12px 16px;font-size:12.5px;color:#1e40af;line-height:1.85;display:flex;gap:10px}
  .hint-box .icon{font-size:18px;flex-shrink:0}
  .locked-banner{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;padding:12px 18px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
  .comp-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
  .comp-head{padding:16px 20px;background:linear-gradient(180deg,#fafbfc,#fff);border-bottom:1px solid var(--border)}
  .comp-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .comp-title h3{font-size:15px;font-weight:700}
  .comp-def{font-size:12.5px;color:var(--muted);line-height:1.8}
  .weight-pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:#eef2ff;color:var(--primary)}
  .level-list{display:flex;flex-direction:column;gap:8px;padding:18px 20px}
  .level-option{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .18s;background:#fff}
  .level-option:hover{border-color:var(--primary-light);background:#f8fafc}
  .level-option input{position:absolute;opacity:0;pointer-events:none}
  .level-num{flex-shrink:0;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
  .level-num.ln1{background:linear-gradient(135deg,#ef4444,#f87171)}
  .level-num.ln2{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
  .level-num.ln3{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
  .level-num.ln4{background:linear-gradient(135deg,#10b981,#34d399)}
  .level-num.ln5{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
  .level-text{font-size:13px;line-height:1.75;flex:1}
  .level-tag{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
  .level-option.selected{border-color:var(--primary);background:linear-gradient(180deg,#eff6ff,#f8fafc)}
  .level-option.selected::after{content:'✓';position:absolute;top:10px;left:12px;color:var(--primary);font-weight:900}
  .na-option .level-num{background:linear-gradient(135deg,#64748b,#94a3b8);font-size:11px}
  .na-option.selected{border-color:#64748b}
  .na-option.selected::after{color:#64748b}
  .evidence-row{padding:14px 20px 18px;background:#fafbfc;border-top:1px solid var(--border)}
  .evidence-row label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
  .evidence-row textarea{width:100%;min-height:56px;font-family:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;resize:vertical}
  .evidence-row textarea:disabled{background:#f1f5f9;cursor:not-allowed}
  .score-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
  .stat{background:linear-gradient(180deg,#fff,#fafbfc);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;position:relative;overflow:hidden}
  .stat::before{content:'';position:absolute;top:0;right:0;left:0;height:4px}
  .stat.beh::before{background:var(--beh)}
  .stat.func::before{background:var(--func)}
  .stat.final::before{background:var(--primary)}
  .stat-label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .stat-value{font-size:30px;font-weight:800;line-height:1.1}
  .stat.beh .stat-value{color:var(--beh)}
  .stat.func .stat-value{color:var(--func)}
  .stat.final .stat-value{color:var(--primary)}
  .stat-sub{font-size:11.5px;color:var(--muted);margin-top:6px}
  .progress-track{height:10px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-top:20px}
  .progress-fill{height:100%;border-radius:20px;transition:width .5s;background:linear-gradient(90deg,var(--primary),var(--primary-light))}
  .rating-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px}
  .rating-label{font-size:13.5px;color:var(--muted)}
  .rating-chip{font-size:13px;font-weight:700;padding:6px 16px;border-radius:20px;background:#f1f5f9;color:var(--muted)}
  .rating-excellent{background:rgba(16,185,129,.12);color:var(--success)}
  .rating-great{background:rgba(59,130,246,.12);color:var(--primary)}
  .rating-good{background:rgba(14,165,233,.12);color:var(--func)}
  .rating-warning{background:rgba(245,158,11,.12);color:var(--warning)}
  .rating-danger{background:rgba(239,68,68,.12);color:var(--danger)}
  .feedback-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .feedback-grid textarea{width:100%;min-height:110px;font-family:inherit;font-size:13.5px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);resize:vertical;line-height:1.8}
  .feedback-grid textarea:disabled{background:#f1f5f9;cursor:not-allowed}
  .save-status{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
  .save-status.saved{color:var(--success)}
  .save-status.saving{color:var(--warning)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.error{background:var(--danger)}
  .toast.success{background:var(--success)}
  @media(max-width:640px){.header-inner{padding:0 16px}.content{padding:16px}.brand h1{font-size:14px}.brand p{display:none}.stat-value{font-size:24px}}
</style>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="logo">📊</div>
    <h1>سامانه ارزیابی عملکرد</h1>
    <p>برای ورود، ایمیل و رمز عبور خود را وارد کنید</p>
    <div class="login-error hidden" id="loginError"></div>
    <div class="field"><label>ایمیل</label><input type="email" id="loginEmail" dir="ltr" placeholder="you@example.com"></div>
    <div class="field"><label>رمز عبور</label><input type="password" id="loginPassword" dir="ltr" placeholder="••••••••"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center" onclick="doLogin()">ورود به سامانه</button>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">📊</div>
        <div><h1>سامانه ارزیابی عملکرد — BARS</h1><p id="orgName">—</p></div>
      </div>
      <div class="header-actions">
        <span class="user-chip" id="userChip">—</span>
        <button class="btn btn-ghost" id="backBtn" onclick="goHome()" style="display:none">↩ بازگشت</button>
        <button class="btn btn-ghost" onclick="logout()">🚪 خروج</button>
      </div>
    </div>
  </header>
  <main class="content" id="mainContent"></main>
</div>

<div class="toast" id="toast"></div>

<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUser = null;
let currentProfile = null;
let currentEmployee = null;
let currentEvaluation = null;
let employeesList = [];

function showToast(msg, type=''){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(()=> t.className='toast '+type, 2500);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.classList.add('hidden');
  if (!email || !password){ errEl.textContent='ایمیل و رمز عبور را وارد کنید'; errEl.classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = 'در حال ورود...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'ورود به سامانه';
  if (error){ errEl.textContent = 'خطا: ' + error.message; errEl.classList.remove('hidden'); return; }
  initApp();
}

async function logout(){ await sb.auth.signOut(); location.reload(); }

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){ initApp(); }
  else { document.getElementById('loginScreen').classList.remove('hidden'); }
}

async function initApp(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user){ document.getElementById('loginScreen').classList.remove('hidden'); return; }
  currentUser = user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  currentProfile = profile || { full_name: user.email, role: 'evaluator' };
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('orgName').textContent = APP_CONFIG.ORG_NAME;
  document.getElementById('userChip').textContent = '👤 ' + (currentProfile.full_name || user.email);
  await loadDashboard();
}

async function loadDashboard(){
  currentEmployee = null;
  currentEvaluation = null;
  document.getElementById('backBtn').style.display = 'none';
  const { data: emps, error } = await sb.from('employees').select('*').eq('is_active', true).order('full_name');
  if (error){ showToast('خطا: ' + error.message, 'error'); return; }
  employeesList = emps || [];
  const { data: evals } = await sb.from('evaluations').select('id, employee_id, status, period, final_score, rating_label');
  const evalMap = {};
  (evals||[]).forEach(e => { evalMap[e.employee_id] = e; });
  const mc = document.getElementById('mainContent');
  if (!employeesList.length){
    mc.innerHTML = `<div class="card"><div class="empty-state"><div class="ico">📭</div><h3>هنوز پرسنلی ثبت نشده</h3><p>از پنل ادمین، لیست پرسنل را وارد کنید.</p></div></div>`;
    return;
  }
  let html = `<div class="card"><div class="card-head"><h2>👥 لیست پرسنل تحت ارزیابی شما</h2><span class="badge">${employeesList.length} نفر</span></div><div class="card-body"><div class="emp-grid">`;
  employeesList.forEach(e => {
    const ev = evalMap[e.id];
    const status = ev ? ev.status : 'none';
    const statusText = status==='submitted' ? 'ارسال‌شده' : status==='draft' ? 'پیش‌نویس' : 'شروع نشده';
    const catLabel = e.category === 'technical' ? '⚙️ فنی' : '📋 ستادی';
    const scoreInfo = ev && ev.status==='submitted' && ev.final_score ? ` • امتیاز: ${ev.final_score}` : '';
    html += `<div class="emp-card" onclick="openEmployee('${e.id}')">
      <span class="status-chip status-${status}">${statusText}</span>
      <div class="emp-name">${escapeHtml(e.full_name)}</div>
      <div class="emp-pos">${escapeHtml(e.position||'—')}${scoreInfo}</div>
      <div class="emp-meta"><span>${catLabel}</span><span>${escapeHtml(e.job_level||'—')}</span><span>${escapeHtml(e.unit||'—')}</span></div>
    </div>`;
  });
  html += `</div></div></div>`;
  mc.innerHTML = html;
}

function goHome(){ loadDashboard(); }

async function openEmployee(empId){
  const emp = employeesList.find(e => e.id === empId);
  if (!emp) return;
  currentEmployee = emp;
  const { data: existing } = await sb.from('evaluations').select('*').eq('employee_id', empId).maybeSingle();
  if (existing){
    currentEvaluation = existing;
    const { data: items } = await sb.from('evaluation_items').select('*').eq('evaluation_id', existing.id);
    renderForm(items || []);
  } else {
    const { data: created, error } = await sb.from('evaluations').insert({
      employee_id: empId, evaluator_id: currentUser.id, category: emp.category,
      period: APP_CONFIG.DEFAULT_PERIOD, status: 'draft'
    }).select().single();
    if (error){ showToast('خطا در ایجاد ارزیابی: ' + error.message, 'error'); return; }
    currentEvaluation = created;
    renderForm([]);
  }
  document.getElementById('backBtn').style.display = 'inline-flex';
  window.scrollTo({top:0});
}

function isLocked(){ return currentEvaluation && currentEvaluation.status === 'submitted'; }

function renderForm(items){
  const key = currentEmployee.category;
  const form = FORMS[key];
  const w = CATEGORY_WEIGHTS[key];
  const locked = isLocked();
  const itemMap = {};
  items.forEach(it => itemMap[it.competency_key] = it);
  const ev = currentEvaluation;
  const mc = document.getElementById('mainContent');
  let html = '';
  if (locked){
    html += `<div class="locked-banner">🔒 این ارزیابی در تاریخ ${ev.submitted_at ? new Date(ev.submitted_at).toLocaleDateString('fa-IR') : ''} ثبت نهایی شده و قابل ویرایش نیست.</div>`;
  }
  html += `<div class="card"><div class="card-head"><h2>👤 اطلاعات ارزیابی — ${escapeHtml(currentEmployee.full_name)}</h2><span class="badge">${form.title}</span></div>
    <div class="card-body"><div class="info-grid">
    <div class="field"><label>نام و نام خانوادگی</label><input type="text" value="${escapeHtml(currentEmployee.full_name)}" disabled></div>
    <div class="field"><label>سمت</label><input type="text" value="${escapeHtml(currentEmployee.position||'')}" disabled></div>
    <div class="field"><label>سطح شغلی</label><input type="text" value="${escapeHtml(currentEmployee.job_level||'')}" disabled></div>
    <div class="field"><label>واحد</label><input type="text" value="${escapeHtml(currentEmployee.unit||'')}" disabled></div>
    <div class="field"><label>ارزیاب</label><input type="text" value="${escapeHtml(currentProfile.full_name||'')}" disabled></div>
    <div class="field"><label>دوره ارزیابی</label><input type="text" id="periodInput" value="${escapeHtml(ev.period||'')}" ${locked?'disabled':''} onchange="saveHeader()"></div>
  </div></div></div>`;
  html += `<div class="card"><div class="card-body" style="padding:14px 20px"><div class="hint-box"><span class="icon">💡</span>
    <div>امتیاز هر شایستگی را <b>نسبت به انتظارات سطح شغلی</b> تعیین کنید. سطح ۳ یعنی «مطابق انتظار». اگر مصداق نداشت، <b>N/A</b> را انتخاب کنید.
    <br><b>وزن‌ها:</b> رفتاری ${w.behavioral}٪ + عملکردی ${w.functional}٪</div></div></div></div>`;
  html += renderSection(key, 'behavioral', 'شایستگی‌های رفتاری', w.behavioral, 'beh', 'رفتاری', itemMap, locked);
  html += renderSection(key, 'functional', 'شایستگی‌های عملکردی', w.functional, 'func', 'عملکردی', itemMap, locked);
  html += `<div class="card"><div class="card-head"><h2>📈 جمع‌بندی امتیاز نهایی</h2><span class="badge">وزن: ${w.behavioral}٪ + ${w.functional}٪</span></div>
    <div class="card-body">
      <div class="score-summary">
        <div class="stat beh"><div class="stat-label">میانگین رفتاری</div><div class="stat-value" id="behAvg">—</div><div class="stat-sub">از ۵</div></div>
        <div class="stat func"><div class="stat-label">میانگین عملکردی</div><div class="stat-value" id="funcAvg">—</div><div class="stat-sub">از ۵</div></div>
        <div class="stat final"><div class="stat-label">امتیاز نهایی</div><div class="stat-value" id="finalScore">—</div><div class="stat-sub">از ۱۰۰</div></div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="rating-row"><span class="rating-label">سطح عملکرد کلی:</span><span class="rating-chip" id="ratingChip">در انتظار تکمیل</span></div>
    </div></div>`;
  html += `<div class="card"><div class="card-head"><h2>💬 بازخورد کیفی</h2></div>
    <div class="card-body"><div class="feedback-grid">
      <div class="field"><label>نقاط قوت</label><textarea id="strengths" ${locked?'disabled':''} onchange="saveHeader()">${escapeHtml(ev.strengths||'')}</textarea></div>
      <div class="field"><label>حوزه‌های نیازمند بهبود</label><textarea id="improvements" ${locked?'disabled':''} onchange="saveHeader()">${escapeHtml(ev.improvements||'')}</textarea></div>
      <div class="field"><label>اقدامات توسعه پیشنهادی</label><textarea id="actions" ${locked?'disabled':''} onchange="saveHeader()">${escapeHtml(ev.actions||'')}</textarea></div>
    </div></div></div>`;
  html += `<div class="card"><div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <span class="save-status" id="saveStatus"></span>
    <button class="btn btn-ghost" onclick="printReport()">🖨 گزارش چاپی</button>
    <button class="btn btn-ghost" onclick="exportExcel()">⬇ خروجی اکسل</button>
    ${!locked ? `<button class="btn btn-success" onclick="submitFinal()">✅ ارسال نهایی و قفل کردن</button>` : ''}
  </div></div>`;
  mc.innerHTML = html;
  recalcAll();
}

function renderSection(key, cat, title, weightPct, colorClass, catLabel, itemMap, locked){
  const items = FORMS[key][cat];
  let html = `<div class="card"><div class="card-head"><h2><span class="dot dot-${colorClass}"></span> ${title}</h2><span class="badge badge-${colorClass}">${catLabel} — وزن ${weightPct}٪</span></div><div class="card-body" style="background:#f8fafc">`;
  items.forEach((item, i) => {
    const cKey = `${key}_${cat}_${i}`;
    const saved = itemMap[cKey];
    html += `<div class="comp-card">
      <div class="comp-head"><div class="comp-title"><h3>${i+1}. ${escapeHtml(item.name)}</h3><span class="weight-pill">وزن: ${item.weight}٪</span></div><div class="comp-def">${escapeHtml(item.def)}</div></div>
      <div class="level-list">`;
    item.levels.forEach((text, li) => {
      const lvl = li + 1;
      const checked = saved && !saved.is_na && saved.score === lvl;
      html += `<label class="level-option ${checked?'selected':''}" data-opt="${cKey}">
        <input type="radio" name="${cKey}" value="${lvl}" data-calc data-ckey="${cKey}" data-cat="${cat}" ${locked?'disabled':''} ${checked?'checked':''}>
        <span class="level-num ln${lvl}">${lvl}</span>
        <span class="level-text"><span class="level-tag">${L_TAGS[li]}</span>${escapeHtml(text)}</span>
      </label>`;
    });
    const naChecked = saved && saved.is_na;
    html += `<label class="level-option na-option ${naChecked?'selected':''}" data-opt="${cKey}">
      <input type="radio" name="${cKey}" value="NA" data-calc data-ckey="${cKey}" data-cat="${cat}" ${locked?'disabled':''} ${naChecked?'checked':''}>
      <span class="level-num">N/A</span>
      <span class="level-text"><span class="level-tag">قابل ارزیابی نبود</span>این شایستگی در دوره ارزیابی مصداق نداشته و از محاسبه حذف می‌شود.</span>
    </label></div>
    <div class="evidence-row">
      <label>📎 شواهد / مثال عینی</label>
      <textarea data-evidence="${cKey}" data-cat="${cat}" ${locked?'disabled':''} placeholder="مثال مشخصی که این امتیاز بر آن استوار است...">${escapeHtml(saved?.evidence||'')}</textarea>
    </div></div>`;
  });
  html += `</div></div>`;
  return html;
}

function recalcAll(){
  const key = currentEmployee.category;
  const w = CATEGORY_WEIGHTS[key];
  const beh = calcCategory(key, 'behavioral');
  const func = calcCategory(key, 'functional');
  const finalRaw = beh.avg*(w.behavioral/100) + func.avg*(w.functional/100);
  const final100 = finalRaw*20;
  const has = beh.filled || func.filled;
  const behEl = document.getElementById('behAvg');
  if (!behEl) return;
  behEl.textContent = beh.filled ? beh.avg.toFixed(2) : '—';
  document.getElementById('funcAvg').textContent = func.filled ? func.avg.toFixed(2) : '—';
  document.getElementById('finalScore').textContent = has ? final100.toFixed(1) : '—';
  document.getElementById('progressFill').style.width = Math.min(100, final100) + '%';
  const r = getRating(final100);
  const chip = document.getElementById('ratingChip');
  chip.textContent = has ? r.label : 'در انتظار تکمیل';
  chip.className = 'rating-chip ' + (has ? r.class : '');
}

function calcCategory(key, cat){
  const items = FORMS[key][cat];
  let sum=0, weightSum=0, filled=0;
  items.forEach((item, i) => {
    const el = document.querySelector(`input[name="${key}_${cat}_${i}"]:checked`);
    if (!el) return;
    if (el.value === 'NA') return;
    const v = parseFloat(el.value);
    if (!isNaN(v)){ sum += v*item.weight; weightSum += item.weight; filled++; }
  });
  return { avg: weightSum ? sum/weightSum : 0, filled };
}

function getRating(s){
  if (s >= 95) return { label:'استثنایی و الگوی نقش', class:'rating-excellent' };
  if (s >= 85) return { label:'فراتر از انتظار', class:'rating-great' };
  if (s >= 70) return { label:'مطابق انتظار', class:'rating-good' };
  if (s >= 50) return { label:'کمتر از انتظار', class:'rating-warning' };
  return { label:'نیازمند بهبود جدی', class:'rating-danger' };
}

function setSaveStatus(cls, txt){
  const el = document.getElementById('saveStatus');
  if (!el) return;
  el.className = 'save-status ' + cls;
  el.textContent = txt;
  if (cls === 'saved') setTimeout(()=>{ if(el.textContent==='✓ ذخیره شد') el.textContent=''; }, 2500);
}

async function saveHeader(){
  if (isLocked()) return;
  setSaveStatus('saving','در حال ذخیره...');
  const update = {
    period: document.getElementById('periodInput')?.value || '',
    strengths: document.getElementById('strengths')?.value || '',
    improvements: document.getElementById('improvements')?.value || '',
    actions: document.getElementById('actions')?.value || '',
    eval_date: new Date().toLocaleDateString('fa-IR'),
    updated_at: new Date().toISOString()
  };
  await saveTotals();
  const { error } = await sb.from('evaluations').update(update).eq('id', currentEvaluation.id);
  if (error){ setSaveStatus('','خطا: '+error.message); return; }
  Object.assign(currentEvaluation, update);
  setSaveStatus('saved','✓ ذخیره شد');
}

async function saveItem(cKey, cat){
  if (isLocked()) return;
  const key = currentEmployee.category;
  const idx = parseInt(cKey.split('_').pop());
  const item = FORMS[key][cat][idx];
  const el = document.querySelector(`input[name="${cKey}"]:checked`);
  const evidence = document.querySelector(`textarea[data-evidence="${cKey}"]`)?.value || '';
  const is_na = el ? el.value === 'NA' : false;
  const score = el && el.value !== 'NA' ? parseInt(el.value) : null;
  setSaveStatus('saving','در حال ذخیره...');
  const { error } = await sb.from('evaluation_items').upsert({
    evaluation_id: currentEvaluation.id,
    competency_key: cKey,
    competency_name: item.name,
    category: cat,
    weight: item.weight,
    score: score,
    is_na: is_na,
    evidence: evidence
  }, { onConflict: 'evaluation_id,competency_key' });
  if (error){ setSaveStatus('','خطا: '+error.message); return; }
  await saveTotals();
  setSaveStatus('saved','✓ ذخیره شد');
}

async function saveTotals(){
  const key = currentEmployee.category;
  const w = CATEGORY_WEIGHTS[key];
  const beh = calcCategory(key, 'behavioral');
  const func = calcCategory(key, 'functional');
  const finalRaw = beh.avg*(w.behavioral/100) + func.avg*(w.functional/100);
  const final100 = finalRaw*20;
  const has = beh.filled || func.filled;
  const rating = has ? getRating(final100) : null;
  await sb.from('evaluations').update({
    beh_avg: beh.filled ? Number(beh.avg.toFixed(2)) : null,
    func_avg: func.filled ? Number(func.avg.toFixed(2)) : null,
    final_score: has ? Number(final100.toFixed(1)) : null,
    rating_label: rating ? rating.label : null,
    updated_at: new Date().toISOString()
  }).eq('id', currentEvaluation.id);
}

document.addEventListener('change', e => {
  if (e.target.matches('input[type="radio"][data-calc]')){
    const cKey = e.target.dataset.ckey;
    const cat = e.target.dataset.cat;
    document.querySelectorAll(`[data-opt="${cKey}"]`).forEach(el => el.classList.toggle('selected', el.querySelector('input').checked));
    recalcAll();
    saveItem(cKey, cat);
  }
  if (e.target.matches('textarea[data-evidence]')){
    saveItem(e.target.dataset.evidence, e.target.dataset.cat);
  }
});

async function submitFinal(){
  if (!confirm('آیا مطمئن هستید؟ بعد از ارسال، امکان ویرایش وجود نخواهد داشت.')) return;
  await saveHeader();
  await saveTotals();
  const { error } = await sb.from('evaluations').update({
    status: 'submitted',
    submitted_at: new Date().toISOString()
  }).eq('id', currentEvaluation.id);
  if (error){ showToast('خطا: '+error.message,'error'); return; }
  showToast('✓ ارزیابی با موفقیت ثبت نهایی شد','success');
  setTimeout(()=> loadDashboard(), 1200);
}

  .hdr h1{font-size:15pt}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;margin-bottom:18px}
  .info>div{display:flex;gap:8px}.info b{color:#64748b;min-width:100px;font-size:9pt}
  .section{background:#1e40af;color:#fff;padding:8px 14px;font-size:11pt;font-weight:700;border-radius:6px 6px 0 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .section.beh{background:#7c3aed}.section.func{background:#0284c7}
  table{width:100%;border-collapse:collapse;margin-bottom:16px;border:1px solid #e2e8f0;border-top:none;font-size:9.5pt}
  th{background:#f1f5f9;padding:8px;text-align:right;font-size:9pt;border-bottom:2px solid #cbd5e1}
  td{padding:9px 10px;border-bottom:1px solid #e2e8f0;vertical-align:top}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
  .sc{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;text-align:center}
  .sc .l{font-size:8.5pt;color:#64748b;font-weight:600;margin-bottom:6px}.sc .v{font-size:18pt;font-weight:800}
  .sc.beh .v{color:#7c3aed}.sc.func .v{color:#0284c7}.sc.fin .v{color:#1e40af;font-size:20pt}
  .fb{border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;margin-bottom:10px;background:#fafbfc}
  .fb .t{font-size:10pt;font-weight:700;color:#1e40af;margin-bottom:6px}.fb .c{font-size:9.5pt;line-height:1.85;white-space:pre-wrap}
  .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px;padding-top:14px;border-top:1px dashed #cbd5e1}
  .sig{text-align:center}.sig .line{border-bottom:1px solid #94a3b8;height:50px;margin-bottom:6px}.sig .lbl{font-size:9pt;color:#64748b;font-weight:600}
  @media print{@page{size:A4;margin:10mm}tr{page-break-inside:avoid}}</style></head><body>
  <div class="hdr"><div><h1>گزارش ارزیابی عملکرد</h1><div style="font-size:9pt;opacity:.9">${form.title} — BARS</div></div>
  <div style="text-align:left;font-size:9.5pt">تاریخ چاپ: ${new Date().toLocaleDateString('fa-IR')}<br>دوره: ${escapeHtml(ev.period||'—')}</div></div>
  <div class="info">
    <div><b>نام:</b> ${escapeHtml(currentEmployee.full_name)}</div>

    <div class="sc"><div class="l">سطح عملکرد</div><div class="v" style="font-size:11pt;padding-top:6px">${rating.label}</div></div>
  </div>
  <div class="section" style="background:#0f766e">بازخورد و توسعه</div><div style="height:14px"></div>

  <div class="fb"><div class="t">📈 نیازمند بهبود</div><div class="c">${escapeHtml(ev.improvements||'—')}</div></div>

  const iframe = document.createElement('iframe');

  iframe.contentWindow.document.open();

function exportExcel(){
  const key = currentEmployee.category;
  const form = FORMS[key];
  const w = CATEGORY_WEIGHTS[key];
  const ev = currentEvaluation;
  const aoa = [];
  aoa.push([`فرم ارزیابی عملکرد — ${form.title}`]);
  aoa.push([]);
  aoa.push(['نام', currentEmployee.full_name, 'سمت', currentEmployee.position||'']);
  aoa.push(['سطح', currentEmployee.job_level||'', 'واحد', currentEmployee.unit||'']);
  aoa.push(['ارزیاب', currentProfile.full_name||'', 'دوره', ev.period||'']);
  aoa.push(['وضعیت', ev.status==='submitted'?'ثبت نهایی':'پیش‌نویس']);
  aoa.push([]);
  aoa.push(['دسته','شایستگی','تعریف','وزن','امتیاز','سطح','شواهد']);
  const push = (cat, label) => form[cat].forEach((item,i) => {
    const ck = `${key}_${cat}_${i}`;
    const el = document.querySelector(`input[name="${ck}"]:checked`);
    let score='', lvl='';
    if (el){
      if (el.value==='NA'){ score='N/A'; lvl='قابل ارزیابی نبود'; }
      else { score = parseInt(el.value); lvl = L_TAGS[score-1]; }
    }
    const evidence = document.querySelector(`textarea[data-evidence="${ck}"]`)?.value || '';
    aoa.push([label, item.name, item.def, item.weight, score, lvl, evidence]);
  });
  push('behavioral','رفتاری'); push('functional','عملکردی');
  const beh = calcCategory(key,'behavioral');
  const func = calcCategory(key,'functional');
  const finalRaw = beh.avg*(w.behavioral/100) + func.avg*(w.functional/100);
  const final100 = finalRaw*20;
  const has = beh.filled || func.filled;
  aoa.push([]);
  aoa.push(['میانگین رفتاری', beh.filled?Number(beh.avg.toFixed(2)):'']);
  aoa.push(['میانگین عملکردی', func.filled?Number(func.avg.toFixed(2)):'']);
  aoa.push(['امتیاز نهایی', has?Number(final100.toFixed(1)):'']);
  aoa.push(['سطح عملکرد', has?getRating(final100).label:'']);
  aoa.push([]);
  aoa.push(['نقاط قوت', ev.strengths||'']);
  aoa.push(['نیازمند بهبود', ev.improvements||'']);
  aoa.push(['اقدامات توسعه', ev.actions||'']);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:10},{wch:30},{wch:60},{wch:9},{wch:11},{wch:22},{wch:40}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ارزیابی');
  const d = new Date();
  XLSX.writeFile(wb, `ارزیابی_${currentEmployee.full_name}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.xlsx`);
}
